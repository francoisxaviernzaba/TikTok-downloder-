<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f1115;
        color: #e8eaed;
      }
      header { padding: 14px 16px 10px; border-bottom: 1px solid #1e2128; }
      h1 { font-size: 15px; margin: 0; font-weight: 700; }
      .sub { font-size: 11px; color: #8b93a7; margin-top: 3px; }
      main { padding: 14px 16px 16px; font-size: 13px; line-height: 1.5; }
      ol { margin: 0; padding-left: 18px; }
      li { margin-bottom: 8px; }
      .btn {
        width: 100%;
        margin-top: 12px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #e11d48;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:hover { background: #c81e42; }
      .muted { color: #8b93a7; }
      footer { padding: 10px 16px; border-top: 1px solid #1e2128; font-size: 10px; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <h1>TikDownloader</h1>
      <div class="sub">No watermark · downloads on your own IP</div>
    </header>
    <main>
      <ol>
        <li>Open a <strong>TikTok video</strong> in your browser.</li>
        <li>Click the red <strong>⬇ Download (no watermark)</strong> button on the page.</li>
        <li>Pick a save location — done.</li>
      </ol>
      <button id="go" class="btn">Download current TikTok page</button>
      <div id="status" class="muted" style="margin-top:10px;"></div>
    </main>
    <footer>The video is fetched from your own connection. Nothing is proxied through a server.</footer>
    <script src="popup.js"></script>
  </body>
</html>
