services:
  - type: web
    name: tiktok-downloder
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COBALT_API_URL
        sync: false

  - type: web
    name: cobalt
    runtime: docker
    plan: free
    dockerfilePath: ./cobalt/Dockerfile
    dockerContext: ./cobalt
    envVars:
      - key: COBALT_API_URL
        sync: false